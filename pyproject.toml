[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-line-judge"
version = "0.1.0"
description = "Offline badminton candidate analysis, human review and honest evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "opencv-python-headless>=4.10", "scipy>=1.12", "filelock>=3"]

[project.optional-dependencies]
learning = ["torch>=2.5"]
test = ["pytest>=8"]

[project.scripts]
badminton = "badminton.__main__:main"

[tool.setuptools.packages.find]
include = ["badminton*"]

[tool.setuptools.package-data]
badminton = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
