name: Verify Windows startup and publish 0.5.11

on:
  push:
    branches: [downloads/windows-portable-0.5.11]

permissions:
  contents: read

concurrency:
  group: publish-windows-v0.5.11
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test complete package and the existing 0.5.10 hotfix
        run: python release/validate_windows.py
      - name: Preserve Windows startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-start-validation
          path: reports/*.json
          if-no-files-found: warn

  publish:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reassemble and verify the existing package
        run: python3 release/assemble.py
      - uses: actions/download-artifact@v4
        with:
          name: windows-start-validation
          path: dist
      - name: Publish verified package, hotfix, and Windows reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 release/publish_release.py
